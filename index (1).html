<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Luvra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ov-icon-192.png">
<link rel="apple-touch-icon" href="ov-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Luvra">
<meta property="og:title" content="Luvra – Beauty ကင်မရာနှင့် ချစ်စရာ အခိုက်အတန့်များ မျှဝေရန်">
<meta property="og:description" content="မျက်နှာအလိုက် Effect၊ Beauty ကင်မရာ၊ ဗီဒီယို တည်းဖြတ်ရန်၊ ၂၄ နာရီ snap post – အခမဲ့">
<meta property="og:image" content="https://nanamin5689.github.io/Luvra/ov-icon-512.png">
<meta property="og:url" content="https://nanamin5689.github.io/Luvra/">
<meta name="twitter:card" content="summary">
<meta name="description" content="Snap post၊ ဗီဒီယို၊ ရယ်စရာ camera template၊ Chat တစ်နေရာတည်းတွင်။">
<style>
:root{--bg:#0b0d12;--sf:#151922;--sf2:#1d2330;--tx:#eef1f6;--mu:#98a2b3;--ac:#6c8cff;--ac2:#ff5fa2;--ok:#34d399;--bd:#242b39;--nav:56px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Myanmar","Padauk",sans-serif;overscroll-behavior:none}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;width:100%}
a{color:var(--ac)}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:10px 16px;font-size:.92rem;font-weight:600}
.btn.alt{background:var(--sf2)}
.btn.pink{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.btn:disabled{opacity:.5}
.ellip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tip{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font-size:.8rem;color:var(--mu);line-height:1.55;margin:0 0 12px}

/* top bar */
#top{display:flex;align-items:center;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--bd);background:var(--bg);position:relative;z-index:5}
#cats{flex:1;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;scroll-snap-align:center;padding:7px 15px;border-radius:99px;background:var(--sf);color:var(--mu);font-size:.9rem;white-space:nowrap}
.cat.on{background:var(--tx);color:#0b0d12;font-weight:700}
#srchBtn{flex:0 0 auto;width:42px;height:42px;margin:0 8px 0 2px;border-radius:50%;background:var(--sf);display:grid;place-items:center;box-shadow:-14px 0 14px 4px var(--bg)}
#srchBtn svg{width:20px;height:20px}

/* views */
#main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:12px 12px 24px}
.msg{text-align:center;color:var(--mu);padding:36px 12px;line-height:1.7}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:1rem}
.card p{margin:6px 0;color:var(--mu);line-height:1.6;font-size:.88rem}
.sec{margin:16px 0 8px;color:var(--mu);font-size:.82rem;font-weight:700}

/* avatar */
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;flex:0 0 auto;overflow:hidden;color:#fff}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* post */
.post{background:var(--sf);border:1px solid var(--bd);border-radius:18px;margin:0 0 14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.pm{flex:1;min-width:0}
.pm b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm small{color:var(--mu);font-size:.76rem}
.fbtn{padding:6px 12px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);font-size:.8rem;font-weight:600}
.fbtn.on{background:var(--sf2);border-color:var(--bd);color:var(--mu)}
.ibtn{width:34px;height:34px;border-radius:50%;background:var(--sf2);font-size:1rem;display:grid;place-items:center}
.dots{padding:6px 8px;color:var(--mu);font-size:1.2rem;line-height:1}
.post .media{width:100%;max-height:70vh;object-fit:contain;background:#000;display:block}
.cap{margin:0;padding:10px 14px 4px;line-height:1.55;font-size:.95rem}
.rx{display:flex;gap:6px;padding:8px 10px 12px;flex-wrap:wrap}
.rb{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:99px;background:var(--sf2);border:1px solid transparent;font-size:.8rem;color:var(--mu);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.rb .re{font-size:1.15rem;line-height:1;display:inline-block}
.rb.me{border-color:var(--ac);color:var(--tx);background:#222b45}
.rb.pop .re{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.7) rotate(-8deg)}100%{transform:scale(1)}}

/* video grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vc{background:var(--sf);border-radius:14px;overflow:hidden;text-align:left;display:block;width:100%}
.vc .th{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#222}
.vc .b{padding:8px 10px 10px}
.vc h4{margin:0 0 3px;font-size:.84rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.vc small{color:var(--mu);font-size:.72rem}
.more{display:block;margin:16px auto 0}

/* bottom nav – slim */
#nav{display:flex;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(15,18,26,.97);border-top:1px solid var(--bd);backdrop-filter:blur(10px)}
#nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#6b7587;font-size:.62rem}
#nav svg{width:22px;height:22px}
#nav button.on{color:var(--tx)}
#nav button.on svg{color:var(--ac)}
#nav button.on::before{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:var(--ac)}
#nav .cam{font-size:0}
#nav .cam::before{display:none}
#nav .cam .ring{width:42px;height:42px;border-radius:50%;margin-top:-16px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;border:4px solid #0f121a;box-shadow:0 4px 14px rgba(108,140,255,.35)}
#nav .cam svg{width:20px;height:20px;color:#fff}
.badge{position:absolute;top:5px;left:calc(50% + 4px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#ef4444;color:#fff;font-size:.62rem;display:grid;place-items:center;font-weight:700}

/* overlays */
.ov{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.ovh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--bd)}
.ovh h2{flex:1;margin:0;font-size:1rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x{width:36px;height:36px;border-radius:50%;background:var(--sf);font-size:1rem;flex:0 0 auto}
.ovb{flex:1;overflow-y:auto;padding:12px}
.player{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block;border-radius:12px}
.info p{color:var(--mu);font-size:.88rem;line-height:1.6;margin:8px 0}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border-radius:14px;padding:10px;margin-bottom:10px}
.hrow img.t,.hrow .ph0{width:96px;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#222;flex:0 0 auto}
.hrow b{display:block;font-size:.9rem;line-height:1.35}
.hrow small{color:var(--mu);font-size:.76rem}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:.88rem;z-index:60;max-width:90vw;text-align:center}

/* chat thread */
.bubbles{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bb{max-width:78%;padding:9px 12px;border-radius:18px;background:var(--sf2);align-self:flex-start;line-height:1.45;word-break:break-word}
.bb.me{align-self:flex-end;background:linear-gradient(135deg,#4d6bff,#8a5bff);color:#fff}
.bb small{display:block;font-size:.66rem;opacity:.65;margin-top:3px}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--bg)}
.composer input{flex:1;border-radius:99px}
.composer .btn{border-radius:99px}

/* profile */
.cover{height:150px;background:linear-gradient(135deg,#2a3a7a,#7a2a6a);background-size:cover;background-position:center;position:relative}
.cedit{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);padding:6px 11px;border-radius:99px;font-size:.78rem}
.pavw{position:relative;width:96px;height:96px;margin:-48px 0 0 14px}
.pavw .av{width:96px;height:96px;font-size:2.2rem;border:4px solid var(--bg)}
.pavw .aedit{position:absolute;right:-2px;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--sf2);border:2px solid var(--bg);display:grid;place-items:center;font-size:.85rem}
.pname{padding:8px 14px 0}
.pname h2{margin:0;font-size:1.3rem}
.pname p{margin:4px 0 0;color:var(--mu);font-size:.88rem}
.stats{display:flex;gap:10px;padding:12px 14px}
.stats div{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:14px;text-align:center;padding:10px 4px}
.stats b{display:block;font-size:1.1rem}
.stats small{color:var(--mu);font-size:.72rem}
.big{font-size:2rem;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--mu);padding:5px 0;border-bottom:1px solid var(--bd)}
.kv:last-child{border-bottom:0}
.refbox{display:flex;gap:8px;margin-top:8px}
.refbox input{font-size:.8rem}

/* camera */
#v-camera{display:flex;flex-direction:column;overflow:hidden;background:#000}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none;background:#111}
.hint{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:99px;font-size:.78rem;pointer-events:none;white-space:nowrap}
.chip{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;background:rgba(0,0,0,.6);padding:6px 11px;border-radius:99px;font-size:.82rem;font-weight:700}
.timer{position:absolute;top:calc(44px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#e11d48;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700}
.tools{background:var(--bg);padding:8px 10px 6px}
.tpls{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tpls::-webkit-scrollbar{display:none}
.tp{flex:0 0 auto;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:.66rem}
.tp i{font-style:normal;width:46px;height:46px;border-radius:14px;background:var(--sf);display:grid;place-items:center;font-size:1.4rem;border:2px solid transparent}
.tp.on i{border-color:var(--ac2)}
.tp.on{color:var(--tx)}
.sl{display:flex;gap:10px}
.sl label{flex:1;font-size:.7rem;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.sl input{padding:0;border:0;background:none;height:22px}
#capt{padding:8px 12px;margin:4px 0 6px;font-size:.9rem}
.shut{display:flex;align-items:center;justify-content:space-around;padding:2px 0 4px}
.sbtn{width:46px;height:46px;border-radius:50%;background:var(--sf);font-size:1.2rem}
#shutw{display:flex;flex-direction:column;align-items:center;gap:3px}
#cost{font-size:.7rem;color:var(--mu)}
#shut{width:66px;height:66px;border-radius:50%;border:4px solid #fff;background:none;position:relative}
#shut::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:.15s}
#shut.vid::after{background:#ef4444}
#shut.rec::after{inset:17px;border-radius:8px;background:#ef4444}

/* ===== v5 ===== */
#v-home,#v-video{overflow:hidden}
.reel{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;background:#000;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.reel::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
.slide .md{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;border:0}
.slide .tap{position:absolute;inset:0;z-index:1}
.shade{position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none;z-index:2}
.sinfo{position:absolute;left:12px;right:74px;bottom:14px;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.sinfo .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sinfo .who b{font-size:.98rem;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sinfo p{margin:0 0 6px;line-height:1.5;font-size:.92rem;word-break:break-word}
.sinfo small{opacity:.8;font-size:.76rem}
.fbtn2{padding:5px 12px;border-radius:99px;border:1px solid #fff;color:#fff;font-size:.78rem;font-weight:600}
.fbtn2.on{opacity:.65;border-color:transparent;background:rgba(255,255,255,.2)}
.rail{position:absolute;right:6px;bottom:16px;z-index:4;display:flex;flex-direction:column;gap:12px;align-items:center}
.rbtn{width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);touch-action:manipulation;-webkit-touch-callout:none}
.rbtn i{font-style:normal;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;font-size:1.4rem;backdrop-filter:blur(6px)}
.rbtn.on i{background:rgba(255,95,162,.35)}
.rbtn.pop i{animation:pop .3s ease}
.tray{position:absolute;right:62px;bottom:0;z-index:6;display:flex;gap:4px;background:rgba(20,22,30,.94);border:1px solid var(--bd);border-radius:99px;padding:6px 8px}
.tray button{display:flex;flex-direction:column;align-items:center;font-size:.62rem;color:var(--mu);min-width:36px}
.tray button span{font-size:1.5rem;line-height:1.2}
.tray button.pop span{animation:pop .3s ease}
.burst{position:absolute;z-index:5;font-size:5rem;pointer-events:none;transform:translate(-50%,-50%);animation:burst .8s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.mute{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:99px;font-size:.85rem;pointer-events:none}
.hhead{position:absolute;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;justify-content:center;gap:22px;padding:calc(10px + env(safe-area-inset-top)) 54px 14px;background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none}
.hhead button{pointer-events:auto;color:rgba(255,255,255,.65);font-weight:700;font-size:1rem;padding:4px 2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hhead button.on{color:#fff;border-bottom:2px solid #fff}
.hhead .hs{position:absolute;right:10px;top:calc(6px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff}
.hhead .hs svg{width:20px;height:20px}
.chipw{position:absolute;left:12px;top:12px;z-index:5;background:rgba(0,0,0,.6);padding:6px 11px;border-radius:99px;font-size:.78rem;font-weight:700}
.vbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:2rem}
.sback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:78vh;background:var(--bg);border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column;border:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.shh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd)}
.shb{overflow-y:auto;padding:10px 14px;flex:1;min-height:90px}
.cm{display:flex;gap:10px;padding:8px 0}
.cm .t{flex:1;min-width:0;font-size:.9rem;line-height:1.45;word-break:break-word}
.cm .t b{font-size:.82rem;color:var(--mu);display:block}
.cm .t small{color:var(--mu);font-size:.7rem}
.cm .del{color:var(--mu);padding:4px 8px}
.act{display:block;width:100%;text-align:left;padding:14px 6px;font-size:.98rem;border-bottom:1px solid var(--bd)}
.act:last-child{border-bottom:0}
.act.red{color:#f87171}
.ibar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));z-index:50;background:var(--sf2);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:.85rem;max-width:92vw}
.rclose{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:9;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:1.1rem}
/* camera v5 */
.gtabs{display:flex;gap:6px;padding:0 2px 6px}
.gtabs button{padding:5px 12px;border-radius:99px;background:var(--sf);color:var(--mu);font-size:.76rem}
.gtabs button.on{background:var(--tx);color:#0b0d12;font-weight:700}
.mrow{display:flex;gap:8px;align-items:center;margin:4px 0 6px}
.mrow #capt{margin:0;flex:1}
.mini{padding:8px 12px;border-radius:99px;background:var(--sf);color:var(--mu);font-size:.78rem;white-space:nowrap}
.mini.on{background:#1f3b2c;color:#6ee7b7}
.fchip{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;background:rgba(0,0,0,.6);padding:6px 11px;border-radius:99px;font-size:.74rem}
/* editor */
.edv{background:#000;z-index:35}
.edtop{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.edtop h2{flex:1;margin:0;font-size:.95rem}
.edst{flex:1;min-height:0;position:relative;background:repeating-conic-gradient(#1a1d26 0 25%,#12141b 0 50%) 0 0/20px 20px}
.edst canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none}
.edtabs{display:flex;gap:4px;overflow-x:auto;padding:6px 6px 0;background:var(--bg);scrollbar-width:none}
.edtabs::-webkit-scrollbar{display:none}
.edtabs button{flex:0 0 auto;padding:7px 11px;border-radius:99px;color:var(--mu);font-size:.8rem;white-space:nowrap}
.edtabs button.on{background:var(--sf2);color:var(--tx);font-weight:700}
.edpan{background:var(--bg);padding:8px 10px calc(10px + env(safe-area-inset-bottom));min-height:116px;max-height:210px;overflow-y:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}

<script>
"use strict";
const C = window.CONFIG || {};
const $ = s => document.querySelector(s);
const sb = (C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase)
  ? supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY) : null;
const PER = 12;
// setup.sql ထဲက တန်ဖိုးများနှင့် တူရမည်
const COST = {image: 3, video: 8};
const WATCH_SECS = 30;
const CHAT_TTL = 10;

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs || {})){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k === "svg") e.innerHTML = v;        // static icon markup only
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
const jget = (k, d) => { try{ const v = JSON.parse(lsGet(k) || "null"); return v == null ? d : v; }catch(e){ return d; } };
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
function ago(ts){
  const m = Math.max(1, Math.round((Date.now() - new Date(ts)) / 60000));
  if(m < 60) return m + " မိနစ်က";
  const hr = Math.round(m / 60);
  return hr < 24 ? hr + " နာရီက" : Math.round(hr / 24) + " ရက်က";
}
function left(p){
  const m = Math.round((new Date(p.expires_at) - Date.now()) / 60000);
  if(m <= 0) return "သက်တမ်းကုန်ပြီ";
  return m < 60 ? m + " မိနစ် ကျန်" : Math.floor(m / 60) + " နာရီ ကျန်";
}
const leftMin = m => Math.max(0, Math.ceil((new Date(m.expires_at) - Date.now()) / 60000)) + " မိနစ်";
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k" : String(n);
function avatar(url, name, size){
  const a = h("div", {class:"av", style: size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px` : null});
  if(url){ const i = h("img", {alt:"", loading:"lazy", src:url}); i.onerror = () => { i.remove(); a.textContent = (name || "?").slice(0, 1).toUpperCase(); }; a.append(i); }
  else a.textContent = (name || "?").slice(0, 1).toUpperCase();
  return a;
}

/* ---------- state ---------- */
let user = null, prof = null, balance = 0, tab = "home", cat = "foryou";
let following = new Set();
const CATS = [["foryou","သင့်အတွက်"],["following","Following"],["nature","သဘာဝ"],["city","မြို့"],
  ["animals","တိရစ္ဆာန်"],["food","အစားအစာ"],["travel","ခရီး"],["technology","နည်းပညာ"],["people","လူများ"],["sports","အားကစား"]];
const CAT_Q = {nature:"nature",city:"city",animals:"animals",food:"food",travel:"travel",technology:"technology",people:"people",sports:"sports"};
const REACT = [["like","👍"],["love","❤️"],["laugh","😂"],["wow","😮"],["sad","😢"],["angry","😡"]];

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>',
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="5.5" width="17" height="13" rx="3.2"/><path d="m10.6 9.6 3.6 2.4-3.6 2.4z" fill="currentColor"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.2-1.8h6.2L16.3 7h2.2A1.5 1.5 0 0 1 20 8.5v8.8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.3z"/><circle cx="12" cy="12.8" r="3.2"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M5.5 5h13A2.5 2.5 0 0 1 21 7.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 3.5V17h-2A2.5 2.5 0 0 1 3 14.5v-7A2.5 2.5 0 0 1 5.5 5z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.5 3.6-5.3 7-5.3s6.2 1.8 7 5.3"/></svg>'
};
const NAV = [["home","ပင်မ",ICON.home],["video","ဗီဒီယို",ICON.video],["camera","ကင်မရာ",ICON.camera],["chat","Chat",ICON.chat],["profile","ကျွန်ုပ်",ICON.user]];
let badgeN = 0;
function applyBadge(){ const b = document.querySelector("#nav .badge"); if(!b) return; b.textContent = badgeN > 9 ? "9+" : badgeN; b.hidden = !badgeN; }
function drawNav(){
  const nav = $("#nav"); nav.replaceChildren();
  NAV.forEach(([id, label, svg]) => {
    const b = h("button", {class: (id === tab ? "on " : "") + (id === "camera" ? "cam" : ""), "aria-label": label, onclick: () => go(id)});
    if(id === "camera") b.append(h("span", {class:"ring", svg}));
    else b.append(h("span", {svg}), label);
    if(id === "chat") b.append(h("span", {class:"badge", hidden:true}));
    nav.append(b);
  });
  applyBadge();
}
function drawCats(){
  const box = $("#cats"); box.replaceChildren();
  CATS.filter(c => !(tab === "video" && c[0] === "following")).forEach(([id, label]) => {
    box.append(h("button", {class:"cat" + (id === cat ? " on" : ""), role:"tab", "data-id":id, onclick:() => { cat = id; drawCats(); refresh(); }}, label));
  });
  const on = box.querySelector(".on"); if(on && on.scrollIntoView) on.scrollIntoView({inline:"center", block:"nearest"});
}
function refresh(){ if(tab === "home") loadHome(true); else if(tab === "video") loadVideos(true); }
let convoT = null;
function renderTab(){
  if(tab === "home") loadHome(false);
  else if(tab === "video") loadVideos(false);
  else if(tab === "camera") camOpen();
  else if(tab === "chat") drawChat();
  else if(tab === "profile") drawProfile();
}
function go(t){
  if(tab === "camera" && t !== "camera") camStop();
  if(window.pauseReels) pauseReels();
  if(tab === "chat" && t !== "chat"){ clearInterval(convoT); }
  tab = t;
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "v-" + t);
  $("#top").hidden = t === "camera";
  if(t === "video" && cat === "following") cat = "foryou";
  drawNav(); drawCats(); if(window.setBar) setBar(); renderTab();
}

/* ---------- referral link ဖမ်းယူ ---------- */
(function(){
  try{
    const r = new URLSearchParams(location.search).get("ref");
    if(r){ lsSet("ov_ref", r.trim().toLowerCase().slice(0, 16)); history.replaceState(null, "", location.pathname + location.hash); }
  }catch(e){}
})();

/* ---------- auth / profile / points ---------- */
const uname = () => (prof && prof.username) || (user && ((user.user_metadata && user.user_metadata.username) || (user.email || "").split("@")[0])) || "user";
async function loadFollowing(){
  following = new Set();
  if(!sb || !user) return;
  const {data} = await sb.from("follows").select("followee_id");
  (data || []).forEach(r => following.add(r.followee_id));
}
async function loadProfile(){
  if(!sb || !user) return;
  const {data} = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  prof = data || null;
}
function setBal(){ const b = $("#bal"); if(b) b.textContent = "⭐ " + balance; }
async function loadWallet(){
  if(!sb || !user) return;
  const {data} = await sb.from("wallets").select("balance").eq("user_id", user.id).maybeSingle();
  balance = data ? data.balance : 0; setBal();
}
async function afterLogin(){
  try{
    await sb.rpc("ensure_profile");
    const ref = lsGet("ov_ref");
    if(ref){
      const {data, error} = await sb.rpc("claim_referral", {p_code: ref});
      if(!error){ lsDel("ov_ref"); if(data === "ok") toast("Referral အောင်မြင်ပါသည်! ⭐ +20"); }
    }
    await Promise.all([loadProfile(), loadWallet(), loadFollowing()]);
    startBadge();
  }catch(e){ console.error(e); }
}
function afterLogout(){ prof = null; balance = 0; following = new Set(); stopBadge(); setBal(); }
let lastUid, authFirst = true;
function onUser(u){
  const uid = u ? u.id : null; user = u;
  if(authFirst){ authFirst = false; if(!u){ lastUid = null; return; } }
  if(uid === lastUid) return;
  lastUid = uid;
  (async () => { if(u) await afterLogin(); else afterLogout(); renderTab(); })();
}
function initAuth(){
  if(!sb) return;
  sb.auth.getSession().then(({data}) => onUser(data.session ? data.session.user : null));
  sb.auth.onAuthStateChange((_e, s) => onUser(s ? s.user : null));
}
function loginCard(why){
  const em = h("input", {type:"email", placeholder:"you@email.com", autocomplete:"email"});
  const msg = h("p", {}, "");
  const send = h("button", {class:"btn pink", onclick: async () => {
    if(!sb){ msg.textContent = "Supabase ကို config.js တွင် မချိတ်ရသေးပါ။"; return; }
    if(!em.value.trim()) return;
    send.disabled = true; msg.textContent = "ပို့နေသည်…";
    const {error} = await sb.auth.signInWithOtp({email: em.value.trim(), options:{emailRedirectTo: location.href.split("#")[0].split("?")[0]}});
    msg.textContent = error ? "မအောင်မြင်ပါ - " + error.message : "Email ကို စစ်ပါ။ Login link ကိုနှိပ်ပြီး ဤ app သို့ ပြန်လာပါ။";
    send.disabled = false;
  }}, "Login link ပို့မည်");
  const refNote = lsGet("ov_ref") ? h("p", {}, "🎁 Referral code `" + lsGet("ov_ref") + "` ကို မှတ်ထားပြီး ဝင်ပြီးသည်နှင့် ⭐ +20 ရပါမည်။") : null;
  return h("div", {class:"card"}, h("h3", {}, "အကောင့်ဝင်ရန်"), h("p", {}, why), refNote, h("div", {style:"display:grid;gap:10px;margin-top:10px"}, em, send), msg);
}
function plainCard(t, p){ return h("div", {class:"card"}, h("h3", {}, t), h("p", {}, p)); }

/* ---------- overlays ---------- */
function overlay(title, body, onClose){
  const o = h("div", {class:"ov"},
    h("div", {class:"ovh"}, h("h2", {}, title), h("button", {class:"x", "aria-label":"ပိတ်မည်", onclick: () => o.close()}, "✕")),
    h("div", {class:"ovb"}, body));
  o.close = () => { o.remove(); if(onClose) onClose(); };
  $("#layer").append(o); return o;
}

/* reactions – အကန့်အသတ်မရှိ နှိပ်နိုင် (၀.၇ စက္ကန့်စုပြီး server သို့ပို့) */
const RX = new Map();
async function loadReactions(posts){
  if(!sb || !posts.length) return;
  const ids = posts.map(p => p.id);
  const [t, m] = await Promise.all([
    sb.rpc("reaction_totals", {p_ids: ids}),
    user ? sb.from("reactions").select("post_id,kind,n").in("post_id", ids) : Promise.resolve({data: []})
  ]);
  (t.data || []).forEach(r => { const st = RX.get(r.post_id); if(st) st.tot[r.kind] = Math.max(Number(r.total), st.tot[r.kind] || 0); });
  (m.data || []).forEach(r => { const st = RX.get(r.post_id); if(st) st.mine[r.kind] = r.n; });
  ids.forEach(id => { const st = RX.get(id); if(st) st.render(); });
}

/* ---------- VIDEO (stream only; ကြည့်ရင် point ရ) ---------- */
const IA_NOTE = "လိုင်စင်အချက်အလက်ကို ဖိုင်တင်သူက ကိုယ်တိုင်ဖြည့်ထားခြင်းဖြစ်ပြီး မှားနေနိုင်ပါသည်။ မှန်ကန်မှုမရှိဟု ထင်ပါက Report လုပ်ပါ။";
function licLabel(url){
  if(!url) return null; const u = String(url).toLowerCase();
  if(u.includes("publicdomain")) return "Public Domain";
  const m = u.match(/licenses\/([a-z\-]+)\/([\d.]+)/);
  return m ? "Creative Commons " + m[1].toUpperCase() + " " + m[2] : null;
}
const VP = {
  async ia(t, page){
    const lic = "(licenseurl:*creativecommons.org* OR licenseurl:*publicdomain*)";
    const col = "collection:(feature_films OR prelinger OR classic_cartoons OR nasa)";
    const q = (t ? `(${t}) AND ` : "") + `mediatype:movies AND (${lic} OR ${col})`;
    const url = "https://archive.org/advancedsearch.php?q=" + encodeURIComponent(q)
      + "&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=licenseurl&sort[]=downloads+desc"
      + `&rows=${PER}&page=${page}&output=json`;
    const j = await (await fetch(url)).json();
    return (j.response.docs || []).map(d => ({
      title: d.title || d.identifier,
      creator: Array.isArray(d.creator) ? d.creator[0] : (d.creator || "Internet Archive"),
      src: "Internet Archive", license: licLabel(d.licenseurl) || "Archive collection",
      licenseUrl: d.licenseurl || ("https://archive.org/details/" + d.identifier),
      note: IA_NOTE, thumb: "https://archive.org/services/img/" + d.identifier,
      embed: "https://archive.org/embed/" + d.identifier, pageUrl: "https://archive.org/details/" + d.identifier,
      key: "ia:" + d.identifier
    }));
  },
  async pexels(t, page){
    if(!C.PEXELS_KEY) return [];
    const base = t ? "https://api.pexels.com/videos/search?query=" + encodeURIComponent(t) + "&" : "https://api.pexels.com/videos/popular?";
    const j = await (await fetch(base + `per_page=${PER}&page=${page}`, {headers:{Authorization:C.PEXELS_KEY}})).json();
    return (j.videos || []).map(v => {
      const f = (v.video_files || []).filter(x => x.file_type === "video/mp4").sort((a, b) => a.width - b.width);
      const pick = f.find(x => x.width >= 640) || f[f.length - 1];
      return {title: (v.url || "").split("/").filter(Boolean).pop().replace(/-\d+$/, "").replace(/-/g, " ") || "Pexels video",
        creator: (v.user && v.user.name) || "Pexels", src: "Pexels", license: "Pexels License",
        licenseUrl: "https://www.pexels.com/license/", thumb: v.image, mp4: pick && pick.link, pageUrl: v.url, key: "px:" + v.id};
    }).filter(x => x.mp4);
  },
  async pixabay(t, page){
    if(!C.PIXABAY_KEY) return [];
    const p = new URLSearchParams({key: C.PIXABAY_KEY, per_page: PER, page, safesearch: "true"});
    if(t) p.set("q", t);
    const j = await (await fetch("https://pixabay.com/api/videos/?" + p)).json();
    return (j.hits || []).map(x => {
      const v = x.videos || {}; const k = v.medium && v.medium.url ? "medium" : (v.small && v.small.url ? "small" : null);
      return k ? {title: (x.tags || "Pixabay video").split(",").slice(0, 3).join(", "), creator: x.user, src: "Pixabay",
        license: "Pixabay Content License", licenseUrl: "https://pixabay.com/service/license-summary/",
        thumb: `https://i.vimeocdn.com/video/${x.picture_id}_640x360.jpg`, mp4: v[k].url, pageUrl: x.pageURL, key: "pb:" + x.id} : null;
    }).filter(Boolean);
  },
  async yt(t, page){
    if(!C.YT_KEY || page > 1) return [];
    let url;
    if(t) url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=moderate&maxResults=" + PER + "&q=" + encodeURIComponent(t) + "&key=" + C.YT_KEY;
    else url = "https://www.googleapis.com/youtube/v3/videos?part=snippet,status&chart=mostPopular&maxResults=" + PER + "&key=" + C.YT_KEY;
    const j = await (await fetch(url)).json();

async function fetchVideos(term, page){
  const res = await Promise.allSettled(Object.values(VP).map(f => f(term, page)));
  const lists = res.filter(r => r.status === "fulfilled").map(r => r.value);
  const out = []; const n = Math.max(0, ...lists.map(l => l.length));
  for(let i = 0; i < n; i++) lists.forEach(l => { if(l[i]) out.push(l[i]); });
  return out;
}

function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; }); }
async function cropBlob(file, W, H){
  const img = await loadImg(file); const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); const s = Math.max(W / img.width, H / img.height); const w = img.width * s, hh = img.height * s;
  x.drawImage(img, (W - w) / 2, (H - hh) / 2, w, hh);
  return new Promise(r => c.toBlob(r, "image/jpeg", .85));
}
function pickPic(kind){

      const up = await sb.storage.from("avatars").upload(path, blob, {contentType:"image/jpeg"});

  inp.click();
}

  const led = h("div", {class:"card"}, h("h3", {}, "မကြာသေးမီ Point မှတ်တမ်း"));
  pad.append(pts, ref, led, h("div", {class:"sec"}, "ကျွန်ုပ်၏ ယခုတင်ထားသော post များ" + (SNAP() ? " (၂၄ နာရီအတွင်း)" : "")));
  const list = h("div", {}); pad.append(list);

  const [lg, ps] = await Promise.all([
    sb.from("point_ledger").select("delta,reason,created_at").order("created_at", {ascending:false}).limit(6),
    sb.from("posts").select("*").eq("user_id", user.id).gt("expires_at", new Date().toISOString()).order("created_at", {ascending:false})
  ]);
  (lg.data || []).forEach(r => led.append(h("div", {class:"kv"}, h("span", {}, (LEDGER[r.reason] || r.reason) + " · " + ago(r.created_at)), h("b", {style:"color:" + (r.delta > 0 ? "var(--ok)" : "#f87171")}, (r.delta > 0 ? "+" : "") + r.delta))));
  if(!(lg.data || []).length) led.append(h("p", {}, "မှတ်တမ်း မရှိသေးပါ"));
  const posts = ps.data || [];
  fillStats(stats, user.id);
  if(!posts.length) list.append(h("div", {class:"msg", style:"padding:12px"}, "Post မရှိသေးပါ"));
  posts.forEach(p => {
    const row = h("div", {class:"hrow"},
      p.media_type === "image" ? h("img", {class:"t", src:p.media_url, alt:""}) : h("div", {class:"ph0"}),
      h("div", {style:"flex:1"}, h("b", {}, p.caption || "Post"), h("small", {}, "⏳ " + left(p))),
      h("button", {class:"btn alt", onclick: async () => {
        if(!confirm("ဖျက်မလား?")) return;
        try{ const path = new URL(p.media_url).pathname.split("/posts/")[1]; if(path) await sb.storage.from("posts").remove([decodeURIComponent(path)]); }catch(e){}
        await sb.from("posts").delete().eq("id", p.id); row.remove(); toast("ဖျက်ပြီးပါပြီ");
      }}, "ဖျက်"));
    list.append(row);
  });
}

</script>
